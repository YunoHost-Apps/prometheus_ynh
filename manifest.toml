#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "prometheus"
name = "Prometheus"
description.en = "Monitoring system and time series database"
description.fr = "Supervision chronologique de systèmes et services"

version = "3.13.2~ynh1"

maintainers = ["tituspijean"]

[upstream]
license = "Apache-2.0"
website = "https://prometheus.io"
demo = "https://demo.do.prometheus.io"
admindoc = "https://prometheus.io/docs"
code = "https://github.com/prometheus/prometheus"
cpe = "cpe:2.3:a:prometheus:prometheus"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["i386", "amd64", "armhf", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/prometheus"

    [install.init_main_permission]
    type = "group"
    default = "admins"

    [install.init_api_permission]
    type = "group"
    default = "admins"
    help.en = "Choose which group can access the API. If you select `visitors` without further action, the API and metrics will be completely open. This is not recommended, read the app's configuration page after installation to set up credentials."
    help.fr = "Choisissez quel groupe peut accéder à l'API. Si vous sélectionnez `visiteurs` sans d'autre action, alors l'API et les métriques seront complètement ouvertes. Cela n'est pas recommandé, consultez la page de configuration de l'app après installation pour mettre en place des authentifiants."

[resources]
    [resources.sources]
    [resources.sources.main]
    i386.url = "https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-386.tar.gz"
    i386.sha256 = "44893279b08517c12a495283eded1fee31bbee9b7c0ce6e8a1e8c340f5bb25ab"

    amd64.url = "https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-amd64.tar.gz"
    amd64.sha256 = "0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f"

    armhf.url = "https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-armv7.tar.gz"
    armhf.sha256 = "e5dacfd3968831e83eb4aea501ff6b6e00e6cdb1aa8a8b3b9675bedf5d1a3867"

    arm64.url = "https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-arm64.tar.gz"
    arm64.sha256 = "7cecb17a6f41d59814e1a0581a1f81f79051ad5973d1ecf39e23a9f747d6572a"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.i386 = ".*linux-386.tar.gz"
    autoupdate.asset.amd64 = ".*linux-amd64.tar.gz"
    autoupdate.asset.armhf = ".*linux-armv7.tar.gz"
    autoupdate.asset.arm64 = ".*linux-arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    api.url = "/api"
    api.show_tile = false

    [resources.ports]
    main.default = 9090
